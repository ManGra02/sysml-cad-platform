# bidirectional-sync's addresses when the platform's `dev` runs in the HOST's
# network (.devcontainer/linux-freecad/ at the repository root), loaded after
# docker-compose.dev.yml. Service names do not resolve there; postgres and
# sysml-api are published on the host instead (docker/docker-compose.yml:
# 5432, 9000), so these are the addresses of the host -- as without a container.
services:
  dev:
    environment:
      SYSMLCAD_SYSML_API_URL: "http://localhost:9000"
      PGHOST: "localhost"
      # publish.py's default is the service name http://jupyter:8888.
      SYSMLCAD_JUPYTER_URL: "http://localhost:8888"
      # ...but the KERNEL still runs on the Compose network and publishes to
      # sysml-api:9000 -- the same server as localhost:9000 above, by its
      # other name. publish.py checks the kernel's target against this.
      SYSMLCAD_KERNEL_API_URL: "http://sysml-api:9000"
