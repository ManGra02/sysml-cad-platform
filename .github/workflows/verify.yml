name: SysML-CAD-Verifikation

on:
  push:
    paths: ["cad/**", "mapping/**", "fixtures/**", "src/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src:cad pytest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-report
          path: out/verification.xml
