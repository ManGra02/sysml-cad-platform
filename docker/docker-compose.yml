name: sysml-cad-poc

services:
  postgres:
    image: postgres:16
    container_name: sysml2-postgres
    environment:
      POSTGRES_DB: sysml2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysml2"]
      interval: 5s
      timeout: 3s
      retries: 20

  sysml-api:
    build:
      context: ..
      dockerfile: docker/api-services.Dockerfile
      args:
        DB_HOST: "postgres"
    container_name: sysml2-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    volumes:
      - ivy2:/root/.ivy2
      - sbt:/root/.sbt
      - coursier:/root/.cache/coursier

  jupyter:
    build:
      context: ..
      dockerfile: docker/jupyter.Dockerfile
    container_name: sysml2-jupyter
    depends_on:
      - sysml-api
    ports:
      - "8888:8888"
    environment:
      # Ziel des %publish-Magics. Servicename, nicht localhost.
      ISYSML_API_BASE_PATH: "http://sysml-api:9000"
      JUPYTER_TOKEN: "sysmlcad"
    volumes:
      - ../models:/work/models
      - ../notebooks:/work/notebooks

volumes:
  pgdata:
  ivy2:
  sbt:
  coursier:
