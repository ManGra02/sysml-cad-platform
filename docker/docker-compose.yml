name: sysml-cad-poc

services:
  postgres:
    image: postgres:16
    container_name: sysml2-postgres
    environment:
      POSTGRES_DB: sysml2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sysml2"]
      interval: 5s
      timeout: 3s
      retries: 20

  sysml-api:
    build:
      context: ../vendor/SysML-v2-API-Services
      dockerfile: Dockerfile
    container_name: sysml2-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SYSML_JDBC_URL: "jdbc:postgresql://postgres:5432/sysml2"
      SYSML_JDBC_USER: "postgres"
      SYSML_JDBC_PASSWORD: "mysecretpassword"
    # Ueberschreibt das CMD des Forks: dessen Startzeile kennt den
    # AllowedHostsFilter nicht, der "Host: sysml-api:9000" sonst mit 400 blockt.
    command:
      - /app/start-sysml
      - -Dhttp.address=0.0.0.0
      - -Dhttp.port=9000
      - -Dplay.filters.hosts.allowed.0=.
      - -Dplay.http.secret.key=${PLAY_SECRET:?bitte in .env setzen}
    volumes:
      - ivy2:/root/.ivy2
      - sbt:/root/.sbt
      - coursier:/root/.cache/coursier

  jupyter:
    build:
      context: ..
      dockerfile: docker/jupyter.Dockerfile
    container_name: sysml2-jupyter
    depends_on:
      - sysml-api
    ports:
      - "8888:8888"
    environment:
      # Ziel des %publish-Magics. Servicename, nicht localhost.
      ISYSML_API_BASE_PATH: "http://sysml-api:9000"
      JUPYTER_TOKEN: "sysmlcad"
    volumes:
      - ../models:/work/models
      - ../notebooks:/work/notebooks

volumes:
  pgdata:
  ivy2:
  sbt:
  coursier:
