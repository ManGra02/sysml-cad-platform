# The hand-mapped answer key: which CAD measurement a SysML attribute really is.
#
# Its only job is to give a proposer a number. Without it, "the AI suggests good
# mappings" is an impression; with it, it is a hit rate that a stdlib string
# matcher can be held up against.
#
# TWO THINGS TO UNDERSTAND BEFORE READING THE SCORE
#
# 1. THIS SET IS TOO SMALL TO SEPARATE ANYTHING. Two attributes on one part. A
#    proposer that gets both right has shown that it can match `motorHousing` to
#    `motor_housing`, which is not a discovery. The set becomes useful when
#    models/gearbox.sysml is published and captured -- three parts, ten
#    attributes, two of them genuinely ambiguous between housing and cover.
#    Until then, treat any difference between two proposers here as noise.
#
# 2. AN ANSWER MAY BE RIGHT IN MORE THAN ONE WAY. The same part is measurable
#    through the build123d script and through its STEP export, and the two give
#    identical verdicts -- that is the adapter seam working, not a mistake to
#    penalise. So each entry lists every accepted answer, preferred one first.
version: 1

gold:
  - sysml_part: motorHousing
    attribute: length
    note: >-
      Length is the bounding box along X. Not the same thing as a named feature
      dimension -- which is why the accepted answers pin the axis, not just the
      object.
    accept:
      - adapter: build123d
        cad_object: motor_housing
        method: bbox_size
        args: {axis: X}
      - adapter: step
        cad_object: fixtures/step/motor_housing.step
        method: bbox_size
        args: {axis: X}

  - sysml_part: motorHousing
    attribute: mass
    note: >-
      Homogeneous AlSi10Mg. The script declares the density; the STEP export
      does not carry one, so the file-based answer needs the override and the
      catalogue does not offer `mass` on it at all.
    accept:
      - adapter: build123d
        cad_object: motor_housing
        method: mass
        args: {}
