# For the backend only: makes cad_contract installable as an editable package.
# FreeCAD ignores this file; it finds cad_contract via its own
# Mod directory.
#
# Deliberately ONLY cad_contract -- freecad_bridge and bridge_addon import
# FreeCAD and never belong in the backend environment.

[project]
name = "cad-contract"
version = "0.3.0"
description = "Shared contract between the FreeCAD bridge and the platform backend"
requires-python = ">=3.11,<3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad_contract"]
