[project]
name = "sysml-cad-backend"
version = "0.1.0"
description = "Platform backend: serves the UI, manages the connection to the FreeCAD bridge and hosts the projects' domain logic"
# Pinned to 3.11 like FreeCAD's bundled Python: cad_contract runs in
# both environments, and PEP 695 syntax must not slip in by accident.
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiohttp>=3.9",
    "cad-contract",
    "langgraph>=0.3",
    "langchain-ollama>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.uv.sources]
cad-contract = { path = "../bridge", editable = true }

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
