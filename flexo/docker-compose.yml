# Flexo MMS -- the SysML v2 repository the backend's SysML adapter talks to.
#
#   docker compose -f flexo/docker-compose.yml up -d
#   cd backend && uv run python -m app.sysml setup-org      # once per fresh database
#
# The database is PERSISTENT (docker volume flexo-quad-store): projects survive
# `docker compose down`, Docker Desktop restarts and reboots. Start from scratch:
#   docker compose -f flexo/docker-compose.yml down -v      # -v deletes the volume
#
# SysML v2 API  http://127.0.0.1:8083   <- SYSML_API_URL (backend/app/sysml/config.py)
# layer1        http://127.0.0.1:8080   (versioned RDF storage; only setup-org talks to it)
# Fuseki        http://127.0.0.1:3030   (triple store)
#
# Based on docker-compose/docker-compose.yml of https://github.com/Open-MBEE/flexo-mms-sysmlv2
# (Apache-2.0), changed so it runs on a laptop -- see flexo/README.md.
# All ports bind to 127.0.0.1 only, like the rest of the platform.

services:
  quad-store-server:
    # 4.7 instead of 4.6: 4.6 ships a Java that crashes on cgroup v2 hosts
    # (Docker Desktop/WSL 2, current Linux) -- the same image flexo's own tests use.
    image: atomgraph/fuseki:4.7
    hostname: quad-server
    container_name: quad-server
    env_file:
      - ./env/flexo-mms-quad-store.env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:-UseContainerSupport"
    # On disk (TDB2) instead of in memory (upstream: --file=cluster.trig): the data
    # stays in the volume. quad-store-init loads cluster.trig once, into an empty volume.
    command: --tdb2 --loc=/fuseki-data --update /ds
    # root inside the container, so Fuseki can always write to the fresh volume
    user: "0:0"
    volumes:
      - quad-store:/fuseki-data
    ports:
      - 127.0.0.1:3030:3030

  # One-shot: loads Flexo's starting graphs (mount/cluster.trig) into an EMPTY
  # database, then exits; with data already there it changes nothing.
  quad-store-init:
    image: curlimages/curl:8.10.1
    container_name: quad-store-init
    entrypoint: ["/bin/sh", "/init/init-quad-store.sh"]
    volumes:
      - ./mount/cluster.trig:/init/cluster.trig:ro
      - ./init-quad-store.sh:/init/init-quad-store.sh:ro
    depends_on:
      - quad-store-server

  layer1-service:
    image: openmbee/flexo-mms-layer1-service:v0.3.0
    hostname: layer1-service
    container_name: layer1-service
    env_file:
      - ./env/flexo-mms-jwt.env
      - ./env/flexo-mms-layer1.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m"
    depends_on:
      quad-store-init:
        condition: service_completed_successfully
    ports:
      - 127.0.0.1:8080:8080

  sysmlv2-service:
    image: openmbee/flexo-sysmlv2:v0.2.0
    hostname: flexo-sysmlv2
    container_name: flexo-sysmlv2
    env_file:
      - ./env/flexo-sysmlv2.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    depends_on:
      - layer1-service
    ports:
      - 127.0.0.1:8083:8080

  # SysML v2 Pilot kernel: parses .sysml files for `python -m app.sysml import-sysml`
  # and the import button. Only with the profile, it is a JVM of its own:
  #   docker compose -f flexo/docker-compose.yml --profile import up -d
  sysml-kernel:
    profiles: ["import"]
    build:
      context: .
      dockerfile: jupyter.Dockerfile
    image: sysml-cad-platform/sysml-kernel:0.60.1
    container_name: sysml-kernel
    environment:
      # Target of %publish, as the kernel sees it -> SYSML_KERNEL_TARGET in the backend.
      ISYSML_API_BASE_PATH: ${SYSML_KERNEL_TARGET:-http://flexo-sysmlv2:8080}
      JUPYTER_TOKEN: ${SYSML_KERNEL_TOKEN:-sysmlcad}
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:8888:8888

networks:
  default:
    name: flexo-network
    driver: bridge

volumes:
  quad-store:
    name: flexo-quad-store
